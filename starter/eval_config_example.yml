# Cortex Agent Evaluation Configuration
# Upload this file to the eval config stage before running.
# See: https://docs.snowflake.com/en/user-guide/snowflake-cortex/cortex-agents-evaluations

# --- Dataset Definition ---
# Creates a dataset object from your evaluation table.
# IMPORTANT: Remove this entire 'dataset' block after the first successful run
# to avoid "dataset already exists" errors on subsequent runs.
dataset:
  dataset_type: "CORTEX AGENT"
  table_name: "<database>.<schema>.EVAL_GROUND_TRUTH"    # TODO: table you loaded eval_ground_truth_example.csv into
  dataset_name: "<customer>_EVAL_DATASET"
  column_mapping:
    query_text: "INPUT_QUERY"
    ground_truth: "GROUND_TRUTH_JSON"

# --- Agent Configuration ---
evaluation:
  agent_params:
    agent_name: "<customer>_analyst"                     # TODO: the agent name from Phase 4
    agent_type: "CORTEX AGENT"
  run_params:
    label: "Baseline evaluation"
    description: "Baseline evaluation before the customer demo"
  source_metadata:
    type: "dataset"
    dataset_name: "<customer>_EVAL_DATASET"

# --- Metrics ---
metrics:
  # System metrics
  - "answer_correctness"
  - "logical_consistency"

  # Custom metric example (uncomment to use):
  # - name: "relevance"
  #   score_ranges:
  #     min_score: [1, 3]
  #     median_score: [4, 6]
  #     max_score: [7, 10]
  #   prompt: |
  #     Evaluate the relevance of the agent's response to the user's query.
  #     Rate from 1-10 where:
  #       1 = Completely irrelevant
  #       5 = Partially relevant
  #       10 = Highly relevant and on-topic
  #
  #     Compare the {{output}} with the {{ground_truth}}.
